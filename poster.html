  <style>
    /* Printable A5 counter poster. Print with "Margins: none" and "Background graphics" on.
       QR codes are static inline SVG, generated locally with segno (see README). */
    @page { size: A5 portrait; margin: 0; }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { background: #D9D3C8; font-family: "Jost", Arial, sans-serif; color: #18243A; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .toolbar { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; padding: 20px 16px 0; }
    .toolbar button { font: 500 15px "Jost", Arial, sans-serif; padding: 0 24px; min-height: 44px; border: 0; border-radius: 999px; background: #9C552C; color: #fff; cursor: pointer; }
    .toolbar a { font: 500 15px "Jost", Arial, sans-serif; color: #9C552C; align-self: center; min-height: 44px; display: inline-flex; align-items: center; }
    .sheet {
      width: 148mm; height: 210mm; margin: 20px auto 40px; background: #FBF6EE;
      padding: 13mm 13mm 11mm; display: flex; flex-direction: column; align-items: center; text-align: center;
      position: relative; box-shadow: 0 20px 60px rgba(0,0,0,.18); overflow: hidden;
      font-variant-numeric: lining-nums;
    }
    .logo { width: 19mm; height: 19mm; position: relative; }
    .name { margin: 3.5mm 0 0; font: 400 11.5mm/1 "DM Serif Display", Georgia, serif; position: relative; }
    .sub { margin: 2.2mm 0 0; font: 500 2.7mm "Jost", Arial, sans-serif; letter-spacing: .3em; text-transform: uppercase; color: #9C552C; position: relative; }
    .ar-name { margin: 1.6mm 0 0; font: 600 4mm/1.4 "Noto Kufi Arabic", sans-serif; color: #9C552C; position: relative; }
    .rule { width: 18mm; height: 0; border-top: 0.35mm solid #9C552C; margin: 4.5mm 0 4mm; position: relative; }
    .cta { margin: 0; font: italic 400 6.6mm/1.15 "DM Serif Display", Georgia, serif; color: #9C552C; position: relative; }
    .cta-ar { margin: 1.6mm 0 0; font: 500 4mm/1.45 "Noto Kufi Arabic", sans-serif; color: #5A6170; position: relative; }
    .qr-box { margin-top: 4.5mm; padding: 2.5mm; background: #fff; border: 0.3mm solid #E6DAC6; border-radius: 1.5mm; position: relative; }
    .qr { display: block; width: 54mm; height: 54mm; }
    .phone { margin: 4.5mm 0 0; font: 500 8.4mm/1 "Jost", Arial, sans-serif; letter-spacing: .02em; font-variant-numeric: lining-nums tabular-nums; position: relative; }
    .phone-label { margin: 1.6mm 0 0; font: 500 2.6mm "Jost", Arial, sans-serif; letter-spacing: .24em; text-transform: uppercase; color: #9C552C; position: relative; }
    .foot {
      margin-top: auto; width: 100%; display: flex; align-items: center; gap: 4mm; text-align: start;
      padding-top: 3.5mm; border-top: 0.25mm solid #E6DAC6; position: relative;
    }
    .qr-small { display: block; width: 19mm; height: 19mm; flex: none; background: #fff; padding: 1.2mm; box-sizing: content-box; border: 0.25mm solid #E6DAC6; }
    .foot p { margin: 0; font: 400 2.85mm/1.45 "Jost", Arial, sans-serif; color: #5A6170; }
    .foot b { font-weight: 600; color: #18243A; }
    .sheet::before { content: ''; position: absolute; inset: 5mm; border: .3mm solid #9C552C; outline: .3mm solid #9C552C; outline-offset: -1.6mm; pointer-events: none; }
    .sheet { border-top: 5mm solid #18243A; }
    @media print {
      body { background: none; }
      .toolbar { display: none; }
      .sheet { margin: 0; box-shadow: none; }
    }
    @media screen and (max-width: 600px) {
      .sheet { zoom: .62; }
    }
  </style>
